services:
  postgres:
    image: postgres:18-alpine
    container_name: varyo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: varyo
      POSTGRES_PASSWORD: varyo_dev
      POSTGRES_DB: varyo

    ports:
      - "5432:5432"

    volumes:
      - varyo_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U varyo -d varyo" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  varyo_postgres_data:
