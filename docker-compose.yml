services:
  postgres:
    image: postgres:18-alpine
    container_name: varyo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: varyo
      POSTGRES_PASSWORD: varyo_dev
      POSTGRES_DB: varyo

    ports:
      - "5432:5432"

    volumes:
      - varyo_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U varyo -d varyo" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/warp
    command: server /data --console-address ":9001"
    ports: [ "9000:9000", "9001:9001" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    volumes: [ minio_data:/data ]

  redis:
    image: redis:8-alpine
    container_name: varyo-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - varyo_redis_data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  varyo_postgres_data:
  minio_data:
  varyo_redis_data:
